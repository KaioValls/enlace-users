quarkus:
  http:
    port: 8081
#  log:
#    category:
#      "io.quarkus.hibernate":
#        level: DEBUG
#      "org.hibernate":
#        level: DEBUG
  rest-client:
    group-api:
      url: http://${QUARKUS_CLIENT_HTTP:localhost}:${QUARKUS_CLIENT_PORT:8181}
  micrometer:
    export:
      prometheus:
        path: /metrics
  datasource:
    db-kind: postgresql
    username: ${QUARKUS_DATASOURCE_USERNAME:enlace}
    password: ${QUARKUS_DATASOURCE_PASSWORD:3nl4c3}
    jdbc:
      url: jdbc:postgresql://${QUARKUS_DATASOURCE_HOST:localhost}:${QUARKUS_DATASOURCE_PORT:5433}/user
      driver: org.postgresql.Driver
    reactive:
      url: postgresql://${QUARKUS_DATASOURCE_HOST:localhost}:${QUARKUS_DATASOURCE_PORT:5433}/user

  flyway:
    migrate-at-start: true
    locations: db/migration